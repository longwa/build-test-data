file('../gradle.properties').withInputStream {
    Properties props = new Properties()
    props.load(it)
    project.ext.gradleProperties = props
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.grails.org/grails/restricted' }
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots'
        content {
            includeVersionByRegex('cloud[.]wondrify', '.*', '.*-SNAPSHOT')
        }
    }
    maven {
        url = 'https://repository.apache.org/content/groups/snapshots'
        content {
            includeVersionByRegex 'org[.]apache[.]((grails)|(groovy)).*', '.*', '.*-SNAPSHOT'
        }
    }
}

dependencies {
    // Gradle 9 embeds Groovy 4, so use the Gradle plugin BOM rather than the application grails-bom (Groovy 5)
    implementation platform("org.apache.grails:grails-gradle-bom:${gradleProperties.grailsVersion}")
    implementation "org.apache.grails:grails-gradle-plugins"
    implementation 'org.apache.grails.gradle:grails-publish'
    implementation "cloud.wondrify:asset-pipeline-gradle"
}
