tasks.register('cleanDocs', Delete) {
	delete rootProject.layout.buildDirectory.dir('docs')
}

// Gradle 9 does not allow resolving another project's classpath from a root project task, so copy the plugin's own
// groovydoc output instead of generating the documentation here
tasks.register('aggregateGroovyApiDoc', Copy) {
	dependsOn = [tasks.named('cleanDocs')]

	description = 'Copies the Groovy API Documentation for the plugin project under rootDir/gapi'

	group = JavaBasePlugin.DOCUMENTATION_GROUP
	from project(':build-test-data').tasks.named('groovydoc')
	into rootProject.layout.buildDirectory.dir('docs/gapi')
}

tasks.register('docs') {
	group = JavaBasePlugin.DOCUMENTATION_GROUP
	dependsOn = ['aggregateGroovyApiDoc', 'docs:asciidoctor']
	finalizedBy 'copyAsciiDoctorDocs', 'ghPagesRootIndexPage'
}

tasks.register('copyAsciiDoctorDocs', Copy) {
	group = JavaBasePlugin.DOCUMENTATION_GROUP
	dependsOn = ['docs']
	from "${rootProject.allprojects.find { it.name == 'docs'}.projectDir}/build"
	includes = ['docs/**']
	into rootProject.layout.buildDirectory
	includeEmptyDirs = false
}

tasks.register('ghPagesRootIndexPage', Copy) {
	group = 'documentation'
	dependsOn = ['docs']
	from file("${rootProject.allprojects.find { it.name == 'docs'}.projectDir}/src/docs/index.tmpl")
	into rootProject.layout.buildDirectory.dir('docs')
	rename 'index.tmpl', 'ghpages.html'
}